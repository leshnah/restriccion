name: Actualizar estado de calidad del aire

on:
  schedule:
    # Horas en UTC. En temporada GEC Chile es UTC-4.
    - cron: "30 10 * * *"   # ~06:30 Chile  → declaración del día ya publicada
    - cron: "0 16 * * *"    # ~12:00 Chile  → refresco de respaldo
    - cron: "30 1 * * *"    # ~21:30 Chile  → tras publicarse la declaración del día siguiente
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-estado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Obtener declaración del día
        run: python scripts/actualizar_estado.py

      - name: Commit si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios en estado.json"
          else
            git commit -m "Actualiza estado calidad del aire ($(date -u +%F))"
            git push
          fi
