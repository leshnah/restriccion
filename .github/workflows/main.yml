name: Actualizar estado de calidad del aire

on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "0 16 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pypdf
      - name: Obtener declaración del día
        run: python actualizar_estado.py
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualiza estado ($(date -u +%F))"
            git push
          fi
